[workspace]
resolver = "3"
members = ["crates/protocol", "crates/cli"]
# The in-app crate and the test app build against GPUI in their own workspace, so installing the
# command line never needs a GPUI checkout.
exclude = ["gpui"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wsp-labs/gpui-agent"
rust-version = "1.98"

[workspace.dependencies]
gpui-agent-protocol = { path = "crates/protocol" }
anyhow = "1.0.86"
base64 = "0.22"
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
image = { version = "0.25.1", default-features = false, features = ["png"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
