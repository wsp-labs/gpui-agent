[package]
name = "gpui-agent-testapp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["zed"]
zed = ["dep:gpui", "dep:gpui_platform", "gpui-agent/zed"]
gpui-pre-0-3-9 = ["dep:gpui-pre", "dep:gpui-pre-platform", "gpui-agent/gpui-pre-0-3-9"]

[dependencies]
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
gpui-pre = { workspace = true, optional = true }
gpui-pre-platform = { workspace = true, optional = true }
gpui-agent.workspace = true
serde_json.workspace = true
unicode-segmentation = "1.10"
